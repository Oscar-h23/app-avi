name: Android CI

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Install Android SDK packages
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 2 -maxdepth 4 -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36.1" "build-tools;36.0.0"

      - name: Unit tests, lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avix-validation-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/test-results/

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: avix-debug-apk
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
